<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Tiket</title>
<meta charset="utf-8">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f6f5f2;color:#1d1d1b}
  .wrap{max-width:480px;margin:0 auto;padding:14px}
  h1{font-size:19px;margin:4px 0 10px}
  .stats{display:flex;gap:8px;margin-bottom:10px}
  .stat{flex:1;background:#fff;border:1px solid #e4e2dc;border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:#6b6a65}
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:60px}
  #reader video{border-radius:14px}
  .btn{width:100%;padding:13px;border:0;border-radius:12px;background:#1f5f4a;color:#fff;font-size:16px;font-weight:600;margin-top:10px}
  .btn.ghost{background:transparent;color:#1f5f4a;border:1px solid #1f5f4a}
  .res{border-radius:14px;padding:16px;text-align:center;margin-top:10px;min-height:86px}
  .res .big{font-size:21px;font-weight:700}
  .res .nm{font-size:19px;margin-top:4px;color:#1d1d1b}
  .res .sm{font-size:13px;margin-top:4px}
  .ok{background:#e3f4ea;color:#1f7a4d}.dup{background:#fdf1dc;color:#9a6200}.bad{background:#fbe5e3;color:#b3261e}.idle{background:#fff;color:#6b6a65;border:1px dashed #d8d6cf}
  form{display:flex;gap:6px;margin-top:10px}
  input{flex:1;padding:12px;border:1px solid #e4e2dc;border-radius:10px;font-size:16px}
  form button{padding:0 16px;border:0;border-radius:10px;background:#1d1d1b;color:#fff;font-weight:600}
  .hide{display:none}
  .pin{background:#fff;border:1px solid #e4e2dc;border-radius:14px;padding:18px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div id="pinBox" class="pin hide">
    <h1>Masukkan PIN panitia</h1>
    <form id="pinForm"><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN"><button>Masuk</button></form>
    <div id="pinMsg" class="sm" style="color:#b3261e;margin-top:8px"></div>
  </div>

  <div id="app" class="hide">
    <h1>🎫 Scan Tiket</h1>
    <div class="stats">
      <div class="stat"><b id="sTotal">–</b><span>Terdaftar</span></div>
      <div class="stat"><b id="sIn">–</b><span>Sudah masuk</span></div>
      <div class="stat"><b id="sOut">–</b><span>Belum</span></div>
    </div>
    <div id="reader"></div>
    <button class="btn" id="startBtn">▶ Mulai scan</button>
    <button class="btn ghost hide" id="stopBtn">■ Stop kamera</button>
    <div id="res" class="res idle"><div class="big">Siap scan</div><div class="sm">Arahkan kamera ke QR tiket</div></div>
    <form id="manual"><input id="codeIn" placeholder="atau ketik kode: TKT-XXXXXX" autocapitalize="characters" autocomplete="off"><button>Cek</button></form>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw_vgVzfZj8hOciHzvvF0llkaY8UqUPGWp1Ga99vZOwS0P2fT_uV7MOKd4NSMMeUkHH/exec';
function jsonp(params) {
  return new Promise((res, rej) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('Waktu habis')); }, 15000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('Tidak bisa terhubung')); };
    s.src = API + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb }));
    document.head.appendChild(s);
  });
}
function api(params) {
  const q = new URLSearchParams(params).toString();
  return fetch(API + '?' + q)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(() => jsonp(params)); // jalur cadangan
}
let PIN = '';
try { PIN = localStorage.getItem('tiketPin') || ''; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scanner = null, busy = false, last = '', lastAt = 0, actx;

function beep(f, ms) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; g.gain.value = 0.1; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (ms || 150) / 1000);
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(f > 600 ? 80 : [80, 60, 80]); } catch (e) {}
}

function showPin(msg) { $('app').classList.add('hide'); $('pinBox').classList.remove('hide'); $('pinMsg').textContent = msg || ''; }
function showApp() { $('pinBox').classList.add('hide'); $('app').classList.remove('hide'); refreshStats(); }

$('pinForm').onsubmit = e => {
  e.preventDefault();
  const p = $('pinIn').value.trim();
  api({ action: 'pin', pin: p }).then(ok => {
    if (ok) { PIN = p; try { localStorage.setItem('tiketPin', p); } catch (e) {} showApp(); }
    else $('pinMsg').textContent = 'PIN salah.';
  }).catch(err => $('pinMsg').textContent = 'Gagal: ' + err.message);
};

function refreshStats() {
  api({ action: 'stats', pin: PIN }).then(s => {
    if (!s) return showPin('PIN berubah, masukkan lagi.');
    $('sTotal').textContent = s.total; $('sIn').textContent = s.masuk; $('sOut').textContent = s.total - s.masuk;
  }).catch(() => {});
}

function show(r) {
  const box = $('res');
  if (r.status === 'pin') return showPin('PIN salah atau sudah diganti.');
  if (r.status === 'ok') {
    box.className = 'res ok';
    box.innerHTML = `<div class="big">✓ Berhasil masuk</div><div class="nm">${esc(r.nama)}</div><div class="sm">${esc(r.kategori)} · ${esc(r.kode)} · ${esc(r.waktu)}</div>`;
    beep(880);
  } else if (r.status === 'dup') {
    box.className = 'res dup';
    box.innerHTML = `<div class="big">⚠ Sudah masuk sebelumnya</div><div class="nm">${esc(r.nama)}</div><div class="sm">Check-in pertama: ${esc(r.waktu)}</div>`;
    beep(440, 300);
  } else {
    box.className = 'res bad';
    box.innerHTML = `<div class="big">✕ Tiket tidak terdaftar</div><div class="sm">${esc(r.kode)}</div>`;
    beep(220, 400);
  }
  refreshStats();
}

function cek(text) {
  const now = Date.now();
  if (busy) return;
  if (text === last && now - lastAt < 4000) return; // QR yang sama jangan diproses berulang
  last = text; lastAt = now; busy = true;
  $('res').className = 'res idle'; $('res').innerHTML = '<div class="big">Memeriksa…</div>';
  api({ action: 'checkin', kode: text, pin: PIN })
    .then(r => { busy = false; show(r); })
    .catch(err => {
      busy = false; last = '';
      $('res').className = 'res bad';
      $('res').innerHTML = `<div class="big">Gagal terhubung</div><div class="sm">${esc(err.message)}. Coba scan lagi.</div>`;
    })
    
}

$('startBtn').onclick = async () => {
  try {
    scanner = scanner || new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, cek, () => {});
    $('startBtn').classList.add('hide'); $('stopBtn').classList.remove('hide');
    beep(1, 1); // membuka izin suara di iPhone
  } catch (e) {
    $('res').className = 'res bad';
    $('res').innerHTML = `<div class="big">Kamera tidak bisa dibuka</div><div class="sm">${esc(e && e.message || e)}. Izinkan akses kamera di browser, lalu coba lagi.</div>`;
  }
};
$('stopBtn').onclick = async () => {
  try { await scanner.stop(); } catch (e) {}
  $('stopBtn').classList.add('hide'); $('startBtn').classList.remove('hide');
};
$('manual').onsubmit = e => { e.preventDefault(); const v = $('codeIn').value.trim(); if (v) { last = ''; cek(v); } $('codeIn').value = ''; };

if (PIN) {
  api({ action: 'pin', pin: PIN }).then(ok => ok ? showApp() : showPin()).catch(() => showPin('Tidak bisa terhubung. Cek internet.'));
} else showPin();
setInterval(() => { if (!$('app').classList.contains('hide')) refreshStats(); }, 15000);
</script>
</body>
</html>
