<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Ticket · ÔTELION IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{--green:#0f5f37;--green2:#1b7a4b;--orange:#c8641e;--gold:#d9a441;--maroon:#8b2a1a;--cream:#fbf6ec;--ink:#1f2420;--mute:#6f736d;--line:#ebe4d6}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink)}
  .top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
  .top img{height:34px}
  .top .sep{width:1px;height:28px;background:var(--line)}
  .top nav{margin-left:auto;display:flex;gap:6px}
  .top nav a{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute);text-decoration:none}
  .top nav a.on{background:var(--green);color:#fff}
  .stripe{height:4px;background:linear-gradient(90deg,var(--maroon) 0 33%,var(--gold) 33% 66%,var(--green) 66%)}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  h1{font-family:'Cormorant Garamond',serif;font-size:32px;margin:4px 0 2px;color:var(--green)}
  .sub{color:var(--mute);font-size:14px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:0;border-radius:12px;background:var(--green);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--green2)}
  .btn.full{width:100%}
  .btn.gold{background:var(--orange)}
  .btn.ghost{background:#fff;color:var(--green);border:1px solid #cfe0d5}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:default}
  input,select{padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:15px Inter,sans-serif;background:#fff;color:var(--ink)}
  .msg{color:var(--mute);font-size:14px;text-align:center;padding:12px}
  .err{color:#b3261e}
  /* single ticket */
  .one{max-width:440px;margin:0 auto}
  .one canvas{width:100%;display:block;border-radius:22px;box-shadow:0 12px 40px rgba(15,95,55,.18)}
  .one .actions{display:grid;gap:10px;margin-top:16px}
  /* pin */
  .pin{max-width:400px;margin:40px auto;text-align:center}
  .pin .logos{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
  .pin .logos img:first-child{height:90px}.pin .logos img:last-child{height:40px}
  .pin form{display:flex;gap:8px;margin-top:12px}.pin input{flex:1}
  /* admin */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat b{display:block;font-size:26px;font-weight:800}
  .stat span{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .stat.g b{color:var(--green)}.stat.o b{color:var(--orange)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tools input{flex:1;min-width:180px}
  .list .row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1ece2}
  .list .row:last-child{border-bottom:0}
  .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
  .av img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .btn.sm.foto{background:#fff;color:var(--maroon);border:1px solid #ecd2c9}
  .btn.sm.foto.has{color:var(--green);border-color:#bfe0cc}
  .tag-p{display:inline-block;font:700 10px Inter,sans-serif;letter-spacing:.06em;background:#f6e3dc;color:var(--maroon);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
  .crop{background:#fff;border-radius:22px;padding:20px;text-align:center}
  .crop h3{margin:0;font:700 22px 'Cormorant Garamond',serif;color:var(--green)}
  .crop .sub{margin:2px 0 14px}
  .cwrap{position:relative;width:280px;height:280px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--gold);touch-action:none;cursor:grab;background:#eee}
  .cwrap canvas{width:280px;height:280px;display:block}
  .crop input[type=range]{width:240px;margin:16px auto 4px;display:block;accent-color:var(--green)}
  .crop .hint{font-size:12px;color:var(--mute);margin-bottom:14px}
  .crop .btns{display:grid;gap:8px}
  .fl{display:block;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 0;text-align:left}
  .fl input,.fl select,#fKatL{display:block;width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:16px Inter,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff}
  .fl input:focus,.fl select:focus,#fKatL:focus{outline:2px solid #bfe0cc;border-color:var(--green)}
  #fKatL{margin-top:8px}
  .fhint{font-size:12px;color:var(--mute);margin-top:5px;text-align:left;font-weight:500;text-transform:none;letter-spacing:0}
  .fmsg{color:#b3261e;font-size:13px;font-weight:600;min-height:18px;margin:12px 0 8px;text-align:left}
  .nt{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,40,27,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .nt.show{display:flex}
  .ntb{width:100%;max-width:380px;background:var(--cream);border-radius:26px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:ntin .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes ntin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .nth{padding:28px 20px 22px;color:#fff;background:linear-gradient(135deg,var(--green),#1b7a4b)}
  .nt.bad .nth{background:linear-gradient(135deg,#8f1d16,#c0392b)}
  .nt.vip .nth{background:linear-gradient(135deg,#8b2a1a,#c8641e)}
  .ntic{width:84px;height:84px;margin:0 auto;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font:800 44px Inter,sans-serif;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
  .ntt{font:800 12px Inter,sans-serif;letter-spacing:.14em;margin-top:14px;opacity:.92}
  .ntm{font:700 32px/1.15 'Cormorant Garamond',serif;margin-top:6px}
  .ntd{padding:18px 20px 20px}
  .ntd .n{font:700 24px 'Cormorant Garamond',serif;color:var(--ink)}
  .ntd p{font-size:14px;color:var(--mute);margin:6px 0 16px;line-height:1.5}
  .who{flex:1;min-width:0}
  .who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .kd{font:700 12px 'JetBrains Mono',monospace;color:var(--mute)}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .pill.in{background:#e3f4ea;color:var(--green)}.pill.out{background:#f4efe4;color:var(--mute)}
  .btn.sm.wadone{background:#e3f4ea;color:var(--green);border:1px solid #bfe0cc}
  .wainfo{font-size:12px;color:var(--green);font-weight:600;margin-top:2px}.wainfo a{color:var(--mute);margin-left:6px;cursor:pointer;text-decoration:underline}
  .wanot{font-size:12px;color:var(--orange);font-weight:600;margin-top:2px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .modal{position:fixed;inset:0;background:rgba(20,30,24,.6);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:20}
  .modal.show{display:flex}
  .modal .box{width:100%;max-width:420px}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em}.mclose{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#1f2420;font-size:22px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.3);cursor:pointer} .modal .one canvas{width:auto;max-width:100%;max-height:68vh;margin:0 auto} .modal{padding-top:14px} .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.top img{height:26px}.acts .hide-m{display:none}.top nav a{padding:7px 10px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img src="assets/logo-pradita_1.png" alt="Pradita University"><div class="sep"></div><img src="assets/logo-otelion-mark_1.png" alt="ÔTELION IV">
  <nav id="nav" style="display:none"><a href="./">Scan</a><a href="tiket" class="on">Tiket</a></nav>
</div><div class="stripe"></div></div>
<div class="wrap" id="root"><div class="msg">Memuat…</div></div>
<div class="modal" id="formM"><div class="box"><div class="crop">
  <h3 id="fT">Tambah peserta</h3><div class="sub" id="fS">Data langsung masuk ke spreadsheet dan kode tiket dibuat otomatis.</div>
  <label class="fl">Nama lengkap<input id="fNama" autocomplete="off" placeholder="cth. Budi Santoso"></label>
  <label class="fl">Kategori<select id="fKat"></select></label>
  <input id="fKatL" placeholder="Tulis kategori baru, cth. Dosen" style="display:none" autocomplete="off">
  <label class="fl">No. WhatsApp<input id="fTelp" type="tel" inputmode="tel" autocomplete="off" placeholder="cth. 081234567890"><div class="fhint">Boleh 08… atau 62…, tanpa spasi. Kosongkan kalau belum ada.</div></label>
  <div class="fmsg" id="fMsg"></div>
  <div class="btns"><button class="btn full" id="fSave">Tambah &amp; buat tiket</button><button class="btn full ghost" id="fX">Batal</button></div>
</div></div></div>
<div class="nt" id="nt"><div class="ntb"><div class="nth"><div class="ntic" id="ntic"></div><div class="ntt" id="ntt"></div><div class="ntm" id="ntm"></div></div><div class="ntd"><div class="n" id="ntn"></div><p id="ntp"></p><button class="btn full" id="ntx">Oke, tutup</button></div></div></div>
<input type="file" id="fotoIn" accept="image/*" style="display:none">
<div class="modal" id="cropM"><div class="box"><div class="crop">
  <h3 id="cropT">Foto panitia</h3><div class="sub" id="cropS">Atur posisi wajah di tengah lingkaran</div>
  <div class="cwrap" id="cwrap"><canvas id="cropC" width="560" height="560"></canvas></div>
  <input type="range" id="cropZ" min="1" max="4" step="0.01" value="1">
  <div class="hint">Geser foto untuk mengatur posisi · tarik slider untuk zoom</div>
  <div class="btns"><button class="btn full" id="cropSave">Simpan foto</button><button class="btn full ghost" id="cropPick">Pilih foto lain</button><button class="btn full ghost" id="cropDel" style="color:#b3261e">Hapus foto</button><button class="btn full ghost" id="cropX">Batal</button></div>
</div></div></div>
<div class="modal" id="modal"><div class="box"><div class="mhead"><span>E-Ticket</span><button class="mclose" id="mclose" aria-label="Tutup">✕</button></div><div class="one" id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw_vgVzfZj8hOciHzvvF0llkaY8UqUPGWp1Ga99vZOwS0P2fT_uV7MOKd4NSMMeUkHH/exec';
const SITE = location.origin + location.pathname.replace(/[^/]*$/, '');
const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);}

function jsonp(params) {
  return new Promise((res, rej) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('Waktu habis')); }, 20000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('Tidak bisa terhubung')); };
    s.src = API + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb }));
    document.head.appendChild(s);
  });
}
function api(params) {
  return fetch(API + '?' + new URLSearchParams(params))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(() => jsonp(params));
}

// ---------- aset ----------
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
let ASSETS;
async function assets(){
  if(!ASSETS){
    const [pradita, otelion] = await Promise.all([loadImg('assets/logo-pradita_1.png'), loadImg('assets/logo-otelion-mark_1.png')]);
    try { await document.fonts.load('700 60px "Cormorant Garamond"'); await document.fonts.load('800 40px Inter'); await document.fonts.load('700 40px "JetBrains Mono"'); } catch(e){}
    ASSETS = {pradita, otelion};
  }
  return ASSETS;
}

// ---------- gambar tiket ----------
const KAT = {VIP:['#f6e7c3','#8a5a00'], PANITIA:['#dcefe3','#0f5f37'], UMUM:['#fbe3d2','#a24c12'], PESERTA:['#fbe3d2','#a24c12']};
function katColor(k){return KAT[String(k||'').toUpperCase()] || ['#ece8f6','#4b3f8a'];}
function wrapText(g, text, maxW, max=2) {
  const words = String(text || '').split(/\s+/); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines.slice(0, max);
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function kawung(g,x0,y0,w,h,step,col){ // motif batik kawung sederhana
  g.save(); g.beginPath(); g.rect(x0,y0,w,h); g.clip(); g.strokeStyle=col; g.lineWidth=2;
  for(let y=y0;y<y0+h+step;y+=step)for(let x=x0;x<x0+w+step;x+=step){
    const s=step*.28;
    [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{g.beginPath();g.ellipse(x+dx*s,y+dy*s,dx?s:s*.55,dy?s:s*.55,0,0,Math.PI*2);g.stroke();});
    g.beginPath();g.arc(x,y,2.5,0,Math.PI*2);g.stroke();
  } g.restore();
}
function drawTicket(t, acara, A) {
  const W=1000, H=1780, R=40, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); const CUT=H-300;
  g.fillStyle='rgba(0,0,0,0)'; g.clearRect(0,0,W,H);
  // bentuk tiket dengan lekukan sobekan
  g.save(); g.beginPath();
  g.moveTo(R,0);g.lineTo(W-R,0);g.arcTo(W,0,W,R,R);g.lineTo(W,CUT-38);g.arc(W,CUT,38,-Math.PI/2,Math.PI/2,true);
  g.lineTo(W,H-R);g.arcTo(W,H,W-R,H,R);g.lineTo(R,H);g.arcTo(0,H,0,H-R,R);g.lineTo(0,CUT+38);g.arc(0,CUT,38,Math.PI/2,-Math.PI/2,true);
  g.lineTo(0,R);g.arcTo(0,0,R,0,R);g.closePath(); g.clip();
  g.fillStyle='#fffdf8'; g.fillRect(0,0,W,H);

  // header krem + motif
  const HEAD=560; g.fillStyle='#fbf3e3'; g.fillRect(0,0,W,HEAD);
  kawung(g,0,0,W,HEAD,90,'rgba(217,164,65,.16)');
  const fade=g.createLinearGradient(0,HEAD-160,0,HEAD); fade.addColorStop(0,'rgba(251,243,227,0)'); fade.addColorStop(1,'#fbf3e3'); g.fillStyle=fade; g.fillRect(0,HEAD-160,W,160);
  // baris atas: logo Pradita + label
  if(A.pradita){const h=70,w=A.pradita.width*h/A.pradita.height; g.drawImage(A.pradita,56,48,w,h);}
  g.font='700 22px Inter'; const lab='E-TICKET'; const lw=g.measureText(lab).width+44;
  g.fillStyle='#0f5f37'; rr(g,W-56-lw,56,lw,52,26); g.fill(); g.fillStyle='#fff'; g.textAlign='center'; g.fillText(lab,W-56-lw/2,90);
  // logo Ôtelion besar
  if(A.otelion){const w=520,h=A.otelion.height*w/A.otelion.width; g.drawImage(A.otelion,(W-w)/2,138,w,h);}
  // pita tiga warna
  const sy=HEAD; [['#8b2a1a',0],['#d9a441',1],['#0f5f37',2]].forEach(([col,i])=>{g.fillStyle=col;g.fillRect(i*W/3,sy,W/3+1,10);});

  // nama peserta
  g.textAlign='center'; let y=HEAD+92;
  g.fillStyle='#8a8f86'; g.font='600 22px Inter'; g.fillText('NAMA PESERTA',W/2,y); y+=74;
  g.fillStyle='#0f5f37'; g.font='700 68px "Cormorant Garamond", Georgia, serif';
  wrapText(g,t.nama,W-140).forEach(l=>{g.fillText(l,W/2,y); y+=70;});
  if(t.kategori){ const [bg,fg]=katColor(t.kategori); g.font='800 24px Inter'; const txt=String(t.kategori).toUpperCase(); const tw=g.measureText(txt).width+60;
    g.fillStyle=bg; rr(g,(W-tw)/2,y-24,tw,54,27); g.fill(); g.fillStyle=fg; g.fillText(txt,W/2,y+12); y+=56; }

  // info acara (tanggal / lokasi)
  const info=[['TANGGAL',acara.tanggal],['LOKASI',acara.lokasi]].filter(x=>x[1]);
  if(info.length){ y+=30; const colW=(W-160)/info.length;
    info.forEach(([k,v],i)=>{const cx=80+colW*i+colW/2; g.fillStyle='#8a8f86'; g.font='600 20px Inter'; g.fillText(k,cx,y);
      g.fillStyle='#1f2420'; g.font='600 28px Inter'; wrapText(g,v,colW-30,2).forEach((l,j)=>g.fillText(l,cx,y+40+j*34));});
    if(info.length>1){g.strokeStyle='#ebe4d6';g.lineWidth=2;g.beginPath();g.moveTo(W/2,y-24);g.lineTo(W/2,y+70);g.stroke();}
    y+=90; }

  // QR dengan bingkai sudut emas
  const q=qrcode(0,'M'); q.addData(t.kode); q.make(); const n=q.getModuleCount();
  const space=CUT-y-60; const qsize=Math.min(420,space-60); const cell=Math.floor(qsize/n), qs=cell*n, pad=30, box=qs+pad*2;
  const bx=(W-box)/2, by=y+(space-box)/2+10;
  g.fillStyle='#fff'; rr(g,bx,by,box,box,24); g.fill(); g.strokeStyle='#efe7d6'; g.lineWidth=2; g.stroke();
  g.fillStyle='#14201a'; for(let r=0;r<n;r++)for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect(bx+pad+k*cell,by+pad+r*cell,cell,cell);
  g.strokeStyle='#d9a441'; g.lineWidth=7; g.lineCap='round'; const L=46, o=-14;
  [[bx+o,by+o,1,1],[bx+box-o,by+o,-1,1],[bx+o,by+box-o,1,-1],[bx+box-o,by+box-o,-1,-1]].forEach(([x,yy,dx,dy])=>{g.beginPath();g.moveTo(x,yy+dy*L);g.lineTo(x,yy);g.lineTo(x+dx*L,yy);g.stroke();});

  // sobekan
  g.setLineDash([18,14]); g.strokeStyle='#d8cfbd'; g.lineWidth=4; g.beginPath(); g.moveTo(70,CUT); g.lineTo(W-70,CUT); g.stroke(); g.setLineDash([]);
  // stub
  g.fillStyle='#0f5f37'; g.fillRect(0,CUT+1,W,H-CUT);
  kawung(g,0,CUT,W,H-CUT,90,'rgba(255,255,255,.05)');
  g.fillStyle='rgba(255,255,255,.7)'; g.font='600 22px Inter'; g.fillText('KODE TIKET',W/2,CUT+78);
  g.fillStyle='#ffffff'; g.font='700 66px "JetBrains Mono", Consolas, monospace'; g.fillText(t.kode,W/2,CUT+155);

function pantau(t){ let base=null, done=false, inflight=0, fastUntil=Date.now()+5*60000;
  const wake=()=>{ fastUntil=Date.now()+5*60000; };
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
  ['touchstart','click','scroll'].forEach(e=>window.addEventListener(e,wake,{passive:true}));
  const handle=r=>{ if(!r||r.status!=='ok') return; if(!base){ base=r; return; }
    const baruTolak=r.tolak>base.tolak+20000; if(r.tolak>base.tolak) base.tolak=r.tolak;
    if(r.pulang&&!base.pulang) notif('pulang',t,r.pulang);
    else if(!base.masuk&&r.masuk) notif('ok',t,r.waktu);
    else if(baruTolak) notif('bad',t);
    base.masuk=r.masuk; base.pulang=r.pulang; };
  const cek=async()=>{ inflight++; try{ handle(await api({action:'cek',kode:t.kode})); }catch(e){} inflight--; };
  const loop=()=>{ if(done) return; const vis=document.visibilityState==='visible', fast=vis&&Date.now()<fastUntil;
    if(vis&&inflight<(fast?2:1)) cek(); setTimeout(loop, fast?900:(vis?5000:3000)); };
  loop();
}
function waStat(){const el=document.getElementById('wastat'); if(!el) return; const bisa=LIST.filter(t=>waLink(t.kontak,t,ACARA)).length, sudah=LIST.filter(t=>t.wa).length; el.className='stat'+(sudah>=bisa&&bisa?' g':''); el.innerHTML=`<b>${sudah}<small style="font-size:15px;color:var(--mute)">/${bisa}</small></b><span>Sudah di-WA</span>`;}
async function setWA(t,on){const old=t.wa; t.wa=on?new Date().toTimeString().slice(0,5)+', '+String(new Date().getDate()).padStart(2,'0')+'/'+String(new Date().getMonth()+1).padStart(2,'0'):''; renderList();
  try{const r=await api({action:'wa',pin:PIN,kode:t.kode,on:on?1:0}); if(!r||!r.ok) throw 0; t.wa=r.wa; renderList(); if(!on) toast('Tanda WA dihapus');}catch(e){t.wa=old; renderList(); toast('Gagal menyimpan tanda WA, coba lagi');}}
function closeModal(){ const m=document.getElementById('modal'); if(!m.classList.contains('show')) return; m.classList.remove('show'); if(history.state&&history.state.m) history.back(); } document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();}; document.getElementById('mclose').onclick=closeModal; document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();}); window.addEventListener('popstate',()=>document.getElementById('modal').classList.remove('show'));

const kode = new URLSearchParams(location.search).get('kode') || ((location.search.match(/TKT-[A-Za-z0-9]{6}/)||[])[0]);
if (kode) showOne(kode.trim().toUpperCase());
else if (PIN) loadAll(); else showPin();
</script>
